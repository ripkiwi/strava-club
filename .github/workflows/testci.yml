name: Python Testing CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run script
      run: |
        python main.py

    - name: List files in output/leaderboard-plots
      run: ls -al output/leaderboard-plots/

    - name: Upload leaderboard CSV
      uses: actions/upload-artifact@v4
      with:
        name: leaderboard-csv
        path: output/leaderboard-csv/leaderboard_*.csv

    - name: Upload leaderboard plot
      uses: actions/upload-artifact@v4
      with:
        name: leaderboard-plot
        path: output/leaderboard-plots/leaderboard_*.png
