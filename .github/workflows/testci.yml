name: Python Testing CI

on:
  # push: # Uncomment and comment this for CI Testing, commented for rate limit on Strava API.
  workflow_dispatch:

jobs:
  fetch-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set env variables from secrets
        run: |
          echo "STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }}" >> $GITHUB_ENV
          echo "STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "STRAVA_REFRESH_TOKEN=${{ secrets.STRAVA_REFRESH_TOKEN }}" >> $GITHUB_ENV
          echo "STRAVA_API_URL=${{ secrets.STRAVA_API_URL }}" >> $GITHUB_ENV
          
          echo "GMAIL_PASS=${{ secrets.GMAIL_PASS }}" >> $GITHUB_ENV
          echo "GMAIL_MAIL=${{ secrets.GMAIL_MAIL }}" >> $GITHUB_ENV
          echo "GMAIL_RECIPIENT=${{ secrets.GMAIL_RECIPIENT }}" >> $GITHUB_ENV

      - name: Run data fetch + generate files
        run: python main.py

      - name: Upload zipped data
        uses: actions/upload-artifact@v4
        with:
          name: zipped_output
          path: zipped_output_*

  test-os:
    needs: fetch-ubuntu
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set env variables from secrets
        run: |
          echo "STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }}" >> $GITHUB_ENV
          echo "STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "STRAVA_REFRESH_TOKEN=${{ secrets.STRAVA_REFRESH_TOKEN }}" >> $GITHUB_ENV
          echo "STRAVA_API_URL=${{ secrets.STRAVA_API_URL }}" >> $GITHUB_ENV

          echo "GMAIL_PASS=${{ secrets.GMAIL_PASS }}" >> $GITHUB_ENV
          echo "GMAIL_MAIL=${{ secrets.GMAIL_MAIL }}" >> $GITHUB_ENV
          echo "GMAIL_RECIPIENT=${{ secrets.GMAIL_RECIPIENT }}" >> $GITHUB_ENV

      - name: Test script
        run: python main.py
