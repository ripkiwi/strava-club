name: Python Testing CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set environment variables from GitHub Secrets
      run: |
        echo "STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }}" >> $GITHUB_ENV
        echo "STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "STRAVA_REFRESH_TOKEN=${{ secrets.STRAVA_REFRESH_TOKEN }}" >> $GITHUB_ENV
        echo "STRAVA_API_URL=${{ secrets.STRAVA_API_URL }}" >> $GITHUB_ENV
        
    - name: Run script
      run: |
        python main.py

    - name: List files in output/leaderboard-plots
      run: ls -al output/leaderboard-plots/

    - name: Upload leaderboard CSV
      uses: actions/upload-artifact@v4
      with:
        name: leaderboard-csv-${{ github.run_id }}
        path: output/leaderboard-csv/leaderboard_*.csv

    - name: Upload leaderboard plot
      uses: actions/upload-artifact@v4
      with:
        name: leaderboard-plot-${{ github.run_id }}
        path: output/leaderboard-plots/leaderboard_*.png
